<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iceberg-cpp test report</title>
<style>
/* Colour tokens. Every text/background pair is >= 4.5:1 and every control border, focus ring and bar
   fill >= 3:1 in both themes (the palette of the Iceberg MATLAB test report this page follows). */
:root {
  --bg:#fbfbfa; --panel:#ffffff; --ink:#1b1f24; --mute:#59636e; --line:#dde1e6; --accent:#0b5cd0; --onaccent:#ffffff; --focus:#0b5cd0; --ctl:#6e7781;
  --ok:#1a7f37; --okbg:#dafbe1; --warn:#8a5d00; --warnbg:#fff8c5; --bad:#c21f2b; --badbg:#ffebe9;
  --ign:#57606a; --ignbg:#eaeef2; --bar:#dde1e6; --code:#f3f4f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0e1116; --panel:#151a21; --ink:#e6e9ee; --mute:#98a2ae; --line:#2a313b; --accent:#58a6ff; --onaccent:#0e1116; --focus:#79b8ff; --ctl:#8b949e;
    --ok:#3fb950; --okbg:#12261a; --warn:#d29922; --warnbg:#2b2210; --bad:#f85149; --badbg:#2d1416;
    --ign:#8b949e; --ignbg:#1f252d; --bar:#2a313b; --code:#1a2029;
  }
}
:root[data-theme="dark"] {
  --bg:#0e1116; --panel:#151a21; --ink:#e6e9ee; --mute:#98a2ae; --line:#2a313b; --accent:#58a6ff; --onaccent:#0e1116; --focus:#79b8ff; --ctl:#8b949e;
  --ok:#3fb950; --okbg:#12261a; --warn:#d29922; --warnbg:#2b2210; --bad:#f85149; --badbg:#2d1416;
  --ign:#8b949e; --ignbg:#1f252d; --bar:#2a313b; --code:#1a2029;
}
* { box-sizing:border-box; }
html { font-size:100%; }
html,body { margin:0; background:var(--bg); color:var(--ink); }
body { font:.875rem/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
code,pre,.num { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
code { overflow-wrap:anywhere; }
a { color:var(--accent); }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
.sr { position:absolute !important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip { position:absolute; left:8px; top:-60px; z-index:20; background:var(--accent); color:var(--onaccent); padding:8px 14px; border-radius:6px; font-weight:650; text-decoration:none; }
.skip:focus { top:8px; }
header { display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
header h1 { font-size:.95rem; margin:0 6px 0 0; font-weight:650; }
header .meta { color:var(--mute); font-size:.75rem; flex:1 1 200px; min-width:0; overflow-wrap:anywhere; }
button.theme { border:1px solid var(--ctl); background:var(--panel); color:var(--ink); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-weight:600; min-height:28px; }
.ref { padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); font-size:.8125rem; overflow-wrap:anywhere; }
.ref p { margin:0; max-width:120ch; } .ref p + p { margin-top:4px; }
.ref.absent { background:var(--warnbg); border-left:4px solid var(--warn); }
.ref.absent b { color:var(--ink); }
.layout { display:grid; grid-template-columns:250px minmax(0,1fr); }
nav { border-right:1px solid var(--line); padding:12px 8px; background:var(--panel); overflow-y:auto; position:sticky; top:var(--hh,48px); height:calc(100vh - var(--hh,48px)); }
nav ul { list-style:none; margin:0; padding:0; }
nav .navh { font-size:.6875rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:14px 8px 4px; font-weight:600; }
nav a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; color:var(--ink); text-decoration:none; font-size:.8125rem; }
nav a:hover { background:var(--code); }
nav a[aria-current="page"] { background:var(--accent); color:var(--onaccent); font-weight:600; }
nav a .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--ign); }
nav a .dot.ok { background:var(--ok); } nav a .dot.bad { background:var(--bad); } nav a .dot.warn { background:var(--warn); } nav a .dot.leg { background:var(--ign); }
main { padding:18px 22px 60px; max-width:1200px; min-width:0; }
main:focus { outline:none; }
h2 { margin:0 0 4px; font-size:1.25rem; } h3.sec { margin:22px 0 8px; font-size:.95rem; }
.sub { color:var(--mute); margin:0 0 14px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin:10px 0 18px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; overflow-wrap:anywhere; }
.card .v { font-size:1.5rem; font-weight:650; } .card .v.sm { font-size:1rem; } .card .l { color:var(--mute); font-size:.75rem; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:8px 0; }
.panel.note { border-color:var(--warn); } .panel.bad { border-color:var(--bad); }
.panel ul { margin:6px 0; padding-left:20px; } .panel li { margin:5px 0; }
.tw { overflow-x:auto; max-width:100%; margin:0 0 4px; }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); font-size:.8125rem; }
th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:var(--code); font-weight:600; white-space:nowrap; }
th .thb { all:unset; cursor:pointer; font-weight:600; display:inline-flex; gap:4px; align-items:center; }
th .thb:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
th[aria-sort="ascending"] .thb::after { content:"\25B2"; font-size:.6em; } th[aria-sort="descending"] .thb::after { content:"\25BC"; font-size:.6em; }
tr:last-child td { border-bottom:0; }
tbody tr.click { cursor:pointer; } tbody tr.click:hover { background:var(--code); }
tbody tr.r-over > td { background:var(--badbg); } tbody tr.r-warn > td { background:var(--warnbg); }
.num { text-align:right; white-space:nowrap; }
.tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:.75rem; font-weight:600; }
.tag.ok { background:var(--okbg); color:var(--ok); } .tag.bad { background:var(--badbg); color:var(--bad); }
.tag.ign { background:var(--ignbg); color:var(--ign); } .tag.warn { background:var(--warnbg); color:var(--warn); }
tr.r-over .tag.bad { background:var(--panel); } tr.r-warn .tag.warn { background:var(--panel); }
.bar { height:8px; background:var(--bar); border-radius:4px; min-width:90px; position:relative; overflow:hidden; }
.bar i { position:absolute; left:0; top:0; bottom:0; border-radius:4px; }
.bar.ok i { background:var(--ok); } .bar.warn i { background:var(--warn); } .bar.bad i { background:var(--bad); }
.util { display:flex; align-items:center; gap:8px; } .util .t { min-width:74px; text-align:right; }
.controls { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 10px; align-items:center; }
input[type=search], select { padding:6px 10px; border:1px solid var(--ctl); border-radius:6px; background:var(--panel); color:var(--ink); max-width:100%; font:inherit; }
input[type=search] { min-width:min(320px,100%); }
.chip { border:1px solid var(--ctl); background:var(--panel); color:var(--ink); padding:3px 10px; border-radius:14px; cursor:pointer; font:inherit; font-size:.75rem; }
.chip[aria-pressed="true"] { background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:600; }
details { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:8px 0; }
details > summary { padding:8px 12px; cursor:pointer; font-weight:600; }
details.ex { margin:4px 0 2px; background:transparent; border-color:var(--line); }
details.ex > summary { padding:3px 9px; font-weight:500; font-size:.8125rem; color:var(--accent); }
details.ex .exb { padding:2px 12px 8px; max-width:70ch; }
details.ex .exb p { margin:4px 0; }
details > pre { margin:0 10px 10px; }
pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; font-size:.75rem; white-space:pre-wrap; }
pre.log { max-height:75vh; }
.kv { display:grid; grid-template-columns:150px minmax(0,1fr); gap:4px 12px; }
.kv dt { color:var(--mute); } .kv dd { margin:0; overflow-wrap:anywhere; }
.help { color:var(--mute); font-size:.78rem; }
.doc { max-width:820px; } .doc p { margin:8px 0; } .doc h3 { margin:24px 0 6px; font-size:.95rem; }
.doc dt { font-weight:650; margin-top:10px; } .doc dd { margin:2px 0 0 0; color:var(--mute); }
.doc .kv dt { margin-top:0; font-weight:400; } .doc .kv dd { margin:0; color:var(--ink); }
.doc ol,.doc ul { padding-left:20px; } .doc li { margin:4px 0; }
.lead { font-size:.95rem; }
.about, .pl { white-space:pre-line; max-width:100ch; } code.src { white-space:nowrap; }
.sw { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:baseline; margin-right:4px; }
@media (max-width:820px) {
  header { position:static; }
  .layout { grid-template-columns:minmax(0,1fr); }
  nav { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); }
  nav ul { display:flex; flex-wrap:wrap; gap:2px 6px; }
  main { padding:14px 16px 50px; }
  .kv { grid-template-columns:minmax(0,1fr); gap:0; } .kv dd { margin-bottom:6px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<a class="skip" id="skip" href="#"></a>
<header>
  <h1 id="ttl"></h1>
  <div class="meta" id="meta"></div>
  <button class="theme" id="lang" type="button"></button>
  <button class="theme" id="theme" type="button"></button>
</header>
<div class="ref" id="ref" role="note"></div>
<div class="layout"><nav id="nav"></nav><main id="main" tabindex="-1"></main></div>


<script>/*__DATA__*/</script>
<script>
"use strict";
/* The report of the iceberg-cpp tests (tests/report/build_report.py). Look and
   helpers come from the Iceberg MATLAB test report; the data layer reads the
   GoogleTest XML of each test executable and the measures the tests recorded
   (properties measure:<label> = "<value> <limit> <unit>"). English by default,
   Portuguese with the PT switch or ?lang=pt; a choice made here or on Iceberg MATLAB's
   page (same storage key) is kept. */
let LANG = "en"; try { LANG = localStorage.getItem("iceberg-lang") || "en"; } catch (e) {}
const qLang = new URLSearchParams(location.search).get("lang"); if (qLang === "en" || qLang === "pt") LANG = qLang;
const t2 = (pt, en, ...a) => { let s = LANG === "en" ? en : pt; a.forEach((v, i) => { s = s.split("{" + i + "}").join(v); }); return s; };

/* ---------------------------------------------------------------- helpers */
const cut = (s, n) => (s || "").length > n ? s.slice(0, n - 1).trimEnd() + "\u2026" : (s || "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sci = (x, d = 2) => x === 0 ? "0" : (x == null || !isFinite(x)) ? "-" : (Math.abs(x) >= 1e-3 && Math.abs(x) < 1e4 ? +x.toPrecision(d + 1) + "" : x.toExponential(d));
const fmtPct = u => u == null || !isFinite(u) ? "-" : u === 0 ? "0%" : u < 1e-4 ? t2("menos de 0.01%", "under 0.01%") : (u * 100).toFixed(u < 0.1 ? 2 : 1) + "%";
const fmtMargin = u => u == null ? "-" : !u ? t2("exato", "exact") : (1 / u >= 1e6 ? (1 / u).toExponential(0) : +(1 / u).toPrecision(2)) + "x";
// value/limit of a record for sorting and the worst case: an unbounded ratio (limit 0, NaN) counts as over
const ratioOf = r => r.ratio != null ? r.ratio : r.state === "over" ? Infinity : -1;
const worstOf = rs => rs.reduce((a, r) => ratioOf(r) > ratioOf(a) ? r : a, rs[0]);
function bar(u, cls) {
  if (u == null || isNaN(u)) return "";
  cls = cls || (u > 1 ? "bad" : u > 0.5 ? "warn" : "ok");
  const w = u <= 0 ? 2 : !isFinite(u) ? 100 : Math.max(2, Math.min(100, (Math.log10(u) + 16) / 16 * 100));   // log scale
  return `<div class="bar ${cls}" aria-hidden="true"><i style="width:${w}%"></i></div>`;
}
const utilBar = u => (u == null || isNaN(u)) ? "" : `<div class="util">${bar(u)}<span class="num t">${u === 0 ? t2("0 (exato)", "0 (exact)") : u < 0 ? "&lt; 0" : !isFinite(u) ? "inf" : sci(u, 1)}</span></div>`;
const STATUS = {
  passed:  ["ok", "ok", "ok"],
  failed:  ["bad", "FALHOU", "FAILED"],
  skipped: ["ign", "pulado", "skipped"],
  noref:   ["ign", "sem dados de referencia", "no reference data"],
  disabled:["ign", "desativado", "disabled"]};
const statusTag = s => { const z = STATUS[s] || ["ign", s, s]; return `<span class="tag ${z[0]}">${t2(z[1], z[2])}</span>`; };
const STATE_TAG = {over:() => `<span class="tag bad">${t2("acima do limite", "over the limit")}</span>`, warn:() => `<span class="tag warn">${t2("acima da metade", "above half")}</span>`, unread:() => `<span class="tag ign">${t2("ilegivel", "unreadable")}</span>`, ok:() => ""};
// the header cells become buttons (keyboard operable) that sort the rows; aria-sort tells the state
function sortable(tableEl) {
  if (!tableEl.tHead) return;
  const ths = [...tableEl.tHead.rows[0].cells];
  ths.forEach((th, ci) => {
    th.scope = "col";
    const b = document.createElement("button"); b.type = "button"; b.className = "thb"; b.innerHTML = th.innerHTML; th.textContent = ""; th.appendChild(b);
    b.addEventListener("click", () => {
      const tb = tableEl.tBodies[0], rows = [...tb.rows]; const asc = th.dataset.dir !== "asc";
      ths.forEach(z => { delete z.dataset.dir; z.removeAttribute("aria-sort"); }); th.dataset.dir = asc ? "asc" : "desc"; th.setAttribute("aria-sort", asc ? "ascending" : "descending");
      const key = r => { const c = r.cells[ci]; if (!c) return ""; return c.dataset.v !== undefined ? +c.dataset.v : c.textContent.trim(); };
      rows.sort((p, q) => { const a = key(p), c = key(q); const r = (typeof a === "number" && typeof c === "number") ? a - c : String(a).localeCompare(String(c), "pt", {numeric:true}); return asc ? r : -r; });
      rows.forEach(r => tb.appendChild(r));
    });
  });
}

/* ---------------------------------------------------------------- data
   D.meta: date, commit, branch, dirty, platform, compiler, build_type, fixtures (true/false/null), fixtures_dir, reference, ...
   D.files: [{file "test_x", group (src/ dir it tests), doc (its first comment block), rc, exit, wall, problem, log}]
   D.tests: [{id "test_x/Suite.Name", name "Suite.Name", file, status (passed, failed, skipped, noref, disabled), time, out, skip, source, doc}]
   D.records: [{test (id), file, label, value, limit, unit, ratio (value/limit, signed: below 0 when a bound holds with room), state (ok, warn, over, unread), raw}] */
const D = window.REPORT;
const M = D.meta;
const TESTS = D.tests || [];
const RECS = D.records || [];
const FINFO = {}; for (const f of D.files || []) FINFO[f.file] = f;
const RBT = {}; for (const r of RECS) (RBT[r.test] = RBT[r.test] || []).push(r);
const FILES = (D.files || []).map(f => f.file);
const blockName = f => f.replace(/^test_/i, "");
const groupOf = f => (FINFO[f] || {}).group || "other";
const testsOf = f => TESTS.filter(x => x.file === f);
const recsOf = f => RECS.filter(r => r.file === f);
const count = (ts, s) => ts.filter(x => x.status === s).length;
function stat(f) {
  const ts = testsOf(f), fl = count(ts, "failed"), sk = count(ts, "skipped"), nr = count(ts, "noref"), ds = count(ts, "disabled");
  const ok = count(ts, "passed"), rs = recsOf(f), w = rs.length ? ratioOf(worstOf(rs)) : 0;
  return {n:ts.length, fail:fl, skip:sk, noref:nr, dis:ds, ok, recs:rs.length, worst:w, dot: fl || w > 1 ? "bad" : (sk || w > 0.5) ? "warn" : ok ? "ok" : "leg"};
}

/* ---------------------------------------------------------------- views */
const GROUPS = ["native", "io", "rendering", "calibration", "experiment"];
const groupList = () => { const g = [...new Set(FILES.map(groupOf))]; return GROUPS.filter(x => g.includes(x)).concat(g.filter(x => !GROUPS.includes(x))); };
const main = document.getElementById("main"), nav = document.getElementById("nav");
const cap = s => `<caption class="sr">${s}</caption>`;
function buildNav(cur) {
  const dotTxt = {ok:"ok", warn:t2("atencao", "attention"), bad:t2("falha", "failed"), leg:t2("nada rodou", "nothing ran")};
  const item = (h, label, dot) => `<li><a href="#${h}"${cur === h ? ' aria-current="page"' : ""}><span>${esc(label)}</span>${dot !== undefined ? `<span class="dot ${dot}" aria-hidden="true"></span><span class="sr">(${dotTxt[dot]})</span>` : ""}</a></li>`;
  let h = `<ul>${item("welcome", t2("Boas-vindas", "Welcome")) + item("overview", t2("Visao geral", "Overview")) + item("tests", t2("Todos os testes", "All tests")) + item("measures", t2("Medidas", "Measures")) + item("log", t2("Log bruto", "Raw log"))}</ul>`;
  for (const g of groupList()) h += `<p class="navh">${esc(g)}</p><ul>${FILES.filter(f => groupOf(f) === g).map(f => item("m/" + f, blockName(f), stat(f).dot)).join("")}</ul>`;
  nav.setAttribute("aria-label", t2("Paginas do relatorio", "Report pages"));
  nav.innerHTML = h;
}

const shortSha = () => (M.commit || "").slice(0, 10);
const refLink = () => `<a href="${esc(M.reference.url)}">doi:${esc(M.reference.doi)}</a>`;
// what the comparisons are against, and whether the data were there (at the top of every view)
function refBanner() {
  const el = document.getElementById("ref"), nr = count(TESTS, "noref");
  let h = `<p>${t2("<b>Referencia:</b> as comparacoes com o MATLAB usam os dados de referencia gerados pelo {0}, publicados no Zenodo ({1}) e baixados por <code>{2}</code>.", "<b>Reference:</b> the comparisons with MATLAB use the reference data generated by {0}, published on Zenodo ({1}) and downloaded by <code>{2}</code>.", esc(M.reference.what), refLink(), esc(M.reference.script))} `;
  el.classList.toggle("absent", M.fixtures !== true);
  if (M.fixtures === true) h += t2("Nesta execucao eles estavam presentes (<code>{0}</code>).", "In this run they were present (<code>{0}</code>).", esc(M.fixtures_dir)) + "</p>";
  else if (M.fixtures === false) h += "</p><p><b>" + t2("Nesta execucao eles NAO estavam presentes (<code>{0}</code> nao existe).", "In this run they were NOT present (<code>{0}</code> does not exist).", esc(M.fixtures_dir)) + "</b> "
    + (M.require_fixtures ? t2("Com <code>ICEBERG_REQUIRE_FIXTURES=ON</code>, os testes que comparam com o MATLAB falham em vez de pular.", "With <code>ICEBERG_REQUIRE_FIXTURES=ON</code>, the tests that compare with MATLAB fail instead of skipping.")
      : t2("Os testes que comparam com o MATLAB foram pulados ({0} nesta execucao); so os outros rodaram. Rode <code>{1}</code> e gere o relatorio de novo.", "The tests that compare with MATLAB were skipped ({0} in this run); only the others ran. Run <code>{1}</code> and build the report again.", nr, esc(M.reference.script))) + "</p>";
  else h += "</p><p><b>" + t2("Nao se sabe se eles estavam presentes: a pasta de build nao tem <code>CMakeCache.txt</code>.", "Whether they were present is unknown: the build folder has no <code>CMakeCache.txt</code>.") + "</b>" + (nr ? " " + t2("Testes pulados por falta deles: {0}.", "Tests skipped for want of them: {0}.", nr) : "") + "</p>";
  el.innerHTML = h;
}

function vWelcome() {
  const dl = (a, b) => `<dt>${a}</dt><dd>${b}</dd>`;
  const fx = M.fixtures === true ? t2("presentes", "present") : M.fixtures === false ? t2("AUSENTES", "ABSENT") : t2("desconhecido", "unknown");
  return `<div class="doc"><h2>${t2("Bem-vindo", "Welcome")}</h2><p class="lead">${t2("Este relatorio responde, numa pagina, duas perguntas sobre o iceberg-cpp: <b>os testes passam?</b> e <b>quando um teste compara numeros com uma referencia (os dados de referencia do Iceberg MATLAB, um valor fechado, outro caminho do codigo), com que folga ele passa?</b>", "This report answers, on one page, two questions about iceberg-cpp: <b>do the tests pass?</b> and <b>when a test compares numbers with a reference (the Iceberg MATLAB reference data, a closed-form value, another path through the code), with how much margin does it pass?</b>")}</p>
  <h3>${t2("Como ler este relatorio", "How to read this report")}</h3><ol>
   <li>${t2("Comece pela <a href=\"#overview\">Visao geral</a>: totais e uma linha por arquivo de testes.", "Start with the <a href=\"#overview\">Overview</a>: totals and one row per test file.")}</li>
   <li>${t2("Cada arquivo de testes e um executavel do GoogleTest (por exemplo <code>test_iceberg.cpp</code> testa <code>iceberg::rendering::iceberg(...)</code>). A pagina do arquivo diz o que ele testa, quando o arquivo diz no seu primeiro comentario, e resume em uma frase o quao perto dos limites as medidas ficaram.", "Each test file is one GoogleTest executable (for example <code>test_iceberg.cpp</code> tests <code>iceberg::rendering::iceberg(...)</code>). The file page says what it tests, when the file says so in its first comment, and sums up in one sentence how close to their limits the measures came.")}</li>
   <li>${t2("Em <a href=\"#tests\">Todos os testes</a>, abra <i>O que este teste verifica</i> para ler o comentario acima do teste. Em <a href=\"#measures\">Medidas</a>, cada erro registrado contra o seu limite.", "In <a href=\"#tests\">All tests</a>, open <i>What this test checks</i> to read the comment above the test. In <a href=\"#measures\">Measures</a>, every recorded error against its limit.")}</li></ol>
  <h3>${t2("Vocabulario", "Vocabulary")}</h3><dl>

}

function vBlock(f) {
  const fi = FINFO[f]; if (!fi) return `<h2>${t2("Nao encontrado", "Not found")}</h2>`;
  const ts = testsOf(f), rs = recsOf(f), s = stat(f);
  let h = `<h2>${esc(blockName(f))}</h2><p class="sub">tests/<code>${esc(f)}.cpp</code> \u00b7 ${esc(groupOf(f))} \u00b7 ${t2("executavel", "executable")}: ${esc(fi.exit)}, ${fi.wall.toFixed(2)} s</p>${fi.doc ? `<p class="about" lang="en">${esc(fi.doc)}</p>` : ""}`;
  if (fi.problem) h += `<div class="panel bad"><b>${esc(fi.problem)}</b> ${t2("O executavel conta como um teste que falhou. O log esta abaixo.", "The executable counts as a failed test. Its log is below.")}</div>`;
  h += `<p class="lead">${blockSummary(rs)}</p>`;
  h += `<div class="cards"><div class="card"><div class="v">${s.ok}/${s.n}</div><div class="l">${t2("testes ok", "tests ok")}</div></div><div class="card"><div class="v">${s.recs}</div><div class="l">${t2("medidas registradas", "measures recorded")}</div></div><div class="card"><div class="v">${s.recs ? (isFinite(s.worst) ? sci(s.worst, 1) : "inf") : "-"}</div><div class="l">${t2("pior valor/limite", "worst value/limit")}</div></div></div>`;
  if (rs.length) h += `<h3 class="sec">${t2("Medidas ({0})", "Measures ({0})", rs.length)}</h3>` + measHelp() + measTable(rs, false);
  h += `<h3 class="sec">${t2("Testes ({0})", "Tests ({0})", ts.length)}</h3>` + testsTable(ts, false);
  return h + `<details${fi.problem ? " open" : ""}><summary>${t2("Log do executavel", "Log of the executable")} (logs/${esc(f)}.log)</summary><pre class="log" tabindex="0">${esc(fi.log || "")}</pre></details>`;
}
function vLog() {
  const opts = [["", t2("resumo: uma linha por teste e por medida", "summary: one line per test and per measure")]].concat(FILES.map(f => [f, `logs/${f}.log`]));
  return `<h2>${t2("Log bruto", "Raw log")}</h2><p class="sub">${t2("A saida de cada executavel (stdout e stderr), e um resumo com uma linha por teste e por medida.", "The output of each executable (stdout and stderr), and a summary with one line per test and per measure.")}</p>
   <div class="controls"><label for="lsel">${t2("Mostrar", "Show")}</label><select id="lsel">${opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select></div><pre class="log" id="lpre" tabindex="0">${esc(D.summary || "")}</pre>`;
}
function wireLog() {
  const s = document.getElementById("lsel"); if (!s) return;
  s.addEventListener("change", () => { document.getElementById("lpre").textContent = s.value ? ((FINFO[s.value] || {}).log || "") : (D.summary || ""); });
}

/* ---------------------------------------------------------------- router */
function post() {
  let head = "";
  main.querySelectorAll("h2,h3,h4,table").forEach(el => { if (el.tagName !== "TABLE") { head = el.textContent; return; } if (!el.caption && !el.getAttribute("aria-label")) el.setAttribute("aria-label", head); });
  main.querySelectorAll("table").forEach(tb => { sortable(tb); if (!tb.parentElement.closest("table") && !tb.parentElement.classList.contains("tw")) { const w = document.createElement("div"); w.className = "tw"; tb.replaceWith(w); w.appendChild(tb); } });
  main.querySelectorAll(".tw").forEach(w => { const tb = w.querySelector("table"); w.tabIndex = 0; w.setAttribute("role", "group"); w.setAttribute("aria-label", tb ? (tb.caption ? tb.caption.textContent : tb.getAttribute("aria-label")) : ""); });
  main.querySelectorAll("tr[data-go]").forEach(r => r.addEventListener("click", e => { if (!e.target.closest("a")) location.hash = r.dataset.go; }));
}
const TITLE = () => t2("iceberg-cpp - relatorio de testes", "iceberg-cpp - test report");
function route(o = {}) {
  const h = decodeURIComponent((location.hash || "#welcome").slice(1));
  buildNav(h);
  const views = {welcome:vWelcome, overview:vOverview, tests:vTests, measures:vMeasures, log:vLog};
  const y = o.keep ? window.scrollY : 0;
  main.innerHTML = views[h] ? views[h]() : h.startsWith("m/") ? vBlock(h.slice(2)) : vWelcome();
  post();
  wireFilter();
  wireLog();
  const h2 = main.querySelector("h2");
  document.title = (h2 ? h2.textContent + " - " : "") + TITLE();
  window.scrollTo(0, y);
  if (o.focus) main.focus({preventScroll:true});
}
function chrome() {
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
  document.getElementById("ttl").textContent = TITLE();
  document.getElementById("meta").textContent = [M.date, `${shortSha()} ${M.branch || ""}`.trim() + (M.dirty ? " " + t2("(arvore com alteracoes)", "(working tree with changes)") : ""), [M.compiler, M.build_type].filter(Boolean).join(" "), `${M.platform}, ${M.cores} cores`].filter(Boolean).join(" | ");
  refBanner();
  const l = document.getElementById("lang"); l.textContent = LANG === "en" ? "PT" : "EN";
  l.setAttribute("aria-label", LANG === "en" ? "Mudar o idioma para portugues (Portuguese)" : "Mudar o idioma para ingles (English)");
  const th = document.getElementById("theme"); th.textContent = t2("tema", "theme");
  th.setAttribute("aria-label", t2("Alternar entre tema claro e escuro", "Switch between light and dark theme"));
  th.setAttribute("aria-pressed", String(currentTheme() === "dark"));
  document.getElementById("skip").textContent = t2("Ir para o conteudo", "Skip to content");
  document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
}
const currentTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.getElementById("skip").addEventListener("click", e => { e.preventDefault(); main.focus(); });
document.getElementById("lang").addEventListener("click", () => { LANG = LANG === "en" ? "pt" : "en"; try { localStorage.setItem("iceberg-lang", LANG); } catch (e) {} chrome(); route({keep:true}); });
document.getElementById("theme").addEventListener("click", () => { const r = document.documentElement; r.dataset.theme = currentTheme() === "dark" ? "light" : "dark"; try { localStorage.setItem("iceberg-theme", r.dataset.theme); } catch (e) {} chrome(); });
try { const th = localStorage.getItem("iceberg-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
window.addEventListener("hashchange", () => route({focus:true}));
window.addEventListener("resize", () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px"));
chrome(); route();
</script>
</body>
</html>
